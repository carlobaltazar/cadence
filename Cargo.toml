[package]
name = "cadence"
version = "3.10.2"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rand = "0.8"

[dependencies.winapi]
version = "0.3"
features = [
    "winuser",
    "commdlg",
    "windef",
    "minwindef",
    "minwinbase",
    "libloaderapi",
    "processthreadsapi",
    "profileapi",
    "timeapi",
    "synchapi",
    "winbase",
    "errhandlingapi",
    "wingdi",
    "commctrl",
    "sysinfoapi",
    "consoleapi",
    "processenv",
    "wincon",
    "memoryapi",
    "handleapi",
    "tlhelp32",
    "winnt",
    "winhttp",
    "shellapi",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
